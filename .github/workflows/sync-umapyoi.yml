name: Sync News Archives

on:
  schedule:
    # Every six hours so short-lived official social posts are captured.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Re-fetch every archived news post
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-news-archives
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Synchronize news and gacha metadata
        shell: bash
        run: |
          args=(--locked -- sync-umapyoi --request-interval-ms 1000)
          if [[ "${{ inputs.full || false }}" == "true" ]]; then
            args+=(--full)
          fi
          cargo run "${args[@]}"

      - name: Archive official Global news
        shell: bash
        run: >-
          cargo run --locked -- sync-global-news
          --endpoint 'https://news.tnnlb.dev/api/ajax/pr_info_index?format=json'

      - name: Archive official Global social posts
        shell: bash
        run: cargo run --locked -- sync-global-social

      - name: Commit updated archives
        shell: bash
        run: |
          archive_paths=(
            src/jp_data/umapyoi_archive.json
            src/global_data/official_news_archive.json
            src/global_data/official_social_archive.json
          )
          if git diff --quiet -- "${archive_paths[@]}"; then
            echo "News archives are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${archive_paths[@]}"
          git commit -m "chore: sync news archives"
          git push
