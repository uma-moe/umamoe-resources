name: Build And Deploy Docker

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PLATFORM: linux/amd64
  BETA_REMOTE_APP_DIR: /opt/umamoe-resources-beta
  PROD_REMOTE_APP_DIR: /opt/umamoe-resources
  BETA_HOST_PORT: '3104'
  PROD_HOST_PORT: '3004'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image reference
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_ref="$image_repo:sha-${GITHUB_SHA}"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORM }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.image_ref }}
          cache-from: type=gha,scope=umamoe-resources-image
          cache-to: type=gha,mode=max,scope=umamoe-resources-image

  deploy_beta:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: beta

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mask deployment metadata
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
        run: |
          set -euo pipefail
          for value in "$DEPLOY_HOST" "$GHCR_PULL_USERNAME"; do
            if [[ -n "$value" ]]; then
              echo "::add-mask::$value"
            fi
          done
          while IFS= read -r known_host_line; do
            if [[ -n "$known_host_line" ]]; then
              echo "::add-mask::$known_host_line"
            fi
          done <<< "$DEPLOY_KNOWN_HOSTS"

      - name: Start SSH agent
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add - <<< "$DEPLOY_SSH_KEY" >/dev/null 2>&1

      - name: Configure known hosts
        shell: bash
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create remote runtime env
        shell: bash
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MASTER_REFRESH_INTERVAL_SECONDS: ${{ secrets.MASTER_REFRESH_INTERVAL_SECONDS }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          RUST_LOG: ${{ secrets.RUST_LOG }}
        run: |
          set -euo pipefail
          {
            printf 'IMAGE=%s\n' "$IMAGE_REF"
            printf 'HOST_PORT=%s\n' "${BETA_HOST_PORT}"
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'MASTER_REFRESH_INTERVAL_SECONDS=%s\n' "${MASTER_REFRESH_INTERVAL_SECONDS:-300}"
            printf 'CLOUDFLARE_ZONE_ID=%s\n' "$CLOUDFLARE_ZONE_ID"
            printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CLOUDFLARE_API_TOKEN"
            printf 'PUBLIC_BASE_URL=%s\n' "$PUBLIC_BASE_URL"
            printf 'RUST_LOG=%s\n' "${RUST_LOG:-umamoe_resources=info,info}"
          } > "$RUNNER_TEMP/umamoe-resources.env"

      - name: Upload deployment files
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          remote_port="${DEPLOY_PORT:-22}"
          ssh -o LogLevel=ERROR -p "$remote_port" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '${BETA_REMOTE_APP_DIR}'"
          rsync -az -e "ssh -o LogLevel=ERROR -p $remote_port" deploy/docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:${BETA_REMOTE_APP_DIR}/docker-compose.yml"
          rsync -az -e "ssh -o LogLevel=ERROR -p $remote_port" "$RUNNER_TEMP/umamoe-resources.env" "$DEPLOY_USER@$DEPLOY_HOST:${BETA_REMOTE_APP_DIR}/.env"
          rm -f "$RUNNER_TEMP/umamoe-resources.env"

      - name: Deploy remote container
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          remote_port="${DEPLOY_PORT:-22}"
          printf '%s' "$GHCR_PULL_TOKEN" | ssh -o LogLevel=ERROR -p "$remote_port" "$DEPLOY_USER@$DEPLOY_HOST" "set -euo pipefail; docker login ghcr.io -u '$GHCR_PULL_USERNAME' --password-stdin >/dev/null; cd '${BETA_REMOTE_APP_DIR}'; docker compose --env-file .env pull; docker compose --env-file .env up -d --remove-orphans"

  deploy_production:
    if: github.event_name != 'pull_request'
    needs:
      - build
      - deploy_beta
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mask deployment metadata
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
        run: |
          set -euo pipefail
          for value in "$DEPLOY_HOST" "$GHCR_PULL_USERNAME"; do
            if [[ -n "$value" ]]; then
              echo "::add-mask::$value"
            fi
          done
          while IFS= read -r known_host_line; do
            if [[ -n "$known_host_line" ]]; then
              echo "::add-mask::$known_host_line"
            fi
          done <<< "$DEPLOY_KNOWN_HOSTS"

      - name: Start SSH agent
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add - <<< "$DEPLOY_SSH_KEY" >/dev/null 2>&1

      - name: Configure known hosts
        shell: bash
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create remote runtime env
        shell: bash
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MASTER_REFRESH_INTERVAL_SECONDS: ${{ secrets.MASTER_REFRESH_INTERVAL_SECONDS }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          RUST_LOG: ${{ secrets.RUST_LOG }}
        run: |
          set -euo pipefail
          {
            printf 'IMAGE=%s\n' "$IMAGE_REF"
            printf 'HOST_PORT=%s\n' "${PROD_HOST_PORT}"
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'MASTER_REFRESH_INTERVAL_SECONDS=%s\n' "${MASTER_REFRESH_INTERVAL_SECONDS:-300}"
            printf 'CLOUDFLARE_ZONE_ID=%s\n' "$CLOUDFLARE_ZONE_ID"
            printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CLOUDFLARE_API_TOKEN"
            printf 'PUBLIC_BASE_URL=%s\n' "$PUBLIC_BASE_URL"
            printf 'RUST_LOG=%s\n' "${RUST_LOG:-umamoe_resources=info,info}"
          } > "$RUNNER_TEMP/umamoe-resources.env"

      - name: Upload deployment files
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          remote_port="${DEPLOY_PORT:-22}"
          ssh -o LogLevel=ERROR -p "$remote_port" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '${PROD_REMOTE_APP_DIR}'"
          rsync -az -e "ssh -o LogLevel=ERROR -p $remote_port" deploy/docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:${PROD_REMOTE_APP_DIR}/docker-compose.yml"
          rsync -az -e "ssh -o LogLevel=ERROR -p $remote_port" "$RUNNER_TEMP/umamoe-resources.env" "$DEPLOY_USER@$DEPLOY_HOST:${PROD_REMOTE_APP_DIR}/.env"
          rm -f "$RUNNER_TEMP/umamoe-resources.env"

      - name: Deploy remote container
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          remote_port="${DEPLOY_PORT:-22}"
          printf '%s' "$GHCR_PULL_TOKEN" | ssh -o LogLevel=ERROR -p "$remote_port" "$DEPLOY_USER@$DEPLOY_HOST" "set -euo pipefail; docker login ghcr.io -u '$GHCR_PULL_USERNAME' --password-stdin >/dev/null; cd '${PROD_REMOTE_APP_DIR}'; docker compose --env-file .env pull; docker compose --env-file .env up -d --remove-orphans"
