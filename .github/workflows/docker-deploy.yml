name: Build And Deploy Docker

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  PLATFORM: linux/amd64
  DEPLOY_USER: 'github'
  REMOTE_IMAGE_DIR: /tmp/umamoe-resources-images
  IMAGE_NAME: umamoe-resources
  BETA_REMOTE_APP_DIR: /opt/umamoe-resources-beta
  PROD_REMOTE_APP_DIR: /opt/umamoe-resources
  BETA_HOST_PORT: '3104'
  PROD_HOST_PORT: '3004'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      archive_name: ${{ steps.image.outputs.archive_name }}
      image_tag: ${{ steps.image.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image reference
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_tag="${IMAGE_NAME}:${GITHUB_SHA}"
          archive_name="${IMAGE_NAME}-${GITHUB_SHA}.tar.gz"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORM }}
          load: true
          tags: ${{ steps.image.outputs.image_tag }}
          cache-from: type=gha,scope=umamoe-resources-image
          cache-to: type=gha,mode=max,scope=umamoe-resources-image

      - name: Save image artifact
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          docker save "${{ steps.image.outputs.image_tag }}" | gzip -1 > "${{ runner.temp }}/${{ steps.image.outputs.archive_name }}"

      - name: Upload image artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: umamoe-resources-image
          path: ${{ runner.temp }}/${{ steps.image.outputs.archive_name }}
          if-no-files-found: error

  deploy_beta:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: beta

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: umamoe-resources-image
          path: ${{ runner.temp }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Mask deployment metadata
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for value in "$DEPLOY_HOST"; do
            if [[ -n "$value" ]]; then
              echo "::add-mask::$value"
            fi
          done
          while IFS= read -r known_host_line; do
            if [[ -n "$known_host_line" ]]; then
              echo "::add-mask::$known_host_line"
            fi
          done <<< "$DEPLOY_KNOWN_HOSTS"

      - name: Start SSH agent
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add - <<< "$DEPLOY_SSH_KEY" >/dev/null 2>&1

      - name: Configure known hosts
        shell: bash
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment files
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          ARCHIVE_NAME: ${{ needs.build.outputs.archive_name }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MASTER_REFRESH_INTERVAL_SECONDS: ${{ secrets.MASTER_REFRESH_INTERVAL_SECONDS }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          RUST_LOG: ${{ secrets.RUST_LOG }}
        run: |
          set -euo pipefail
          remote_port="${DEPLOY_PORT:-22}"
          remote_archive="${REMOTE_IMAGE_DIR}/${ARCHIVE_NAME}"
          ssh -o LogLevel=ERROR -p "$remote_port" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '${BETA_REMOTE_APP_DIR}' '${REMOTE_IMAGE_DIR}' && chmod 700 '${BETA_REMOTE_APP_DIR}'"
          rsync -az -e "ssh -o LogLevel=ERROR -p $remote_port" deploy/docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:${BETA_REMOTE_APP_DIR}/docker-compose.yml"
          rsync -az -e "ssh -o LogLevel=ERROR -p $remote_port" "${{ runner.temp }}/${ARCHIVE_NAME}" "$DEPLOY_USER@$DEPLOY_HOST:${remote_archive}"
          {
            printf 'IMAGE=%s\n' "$IMAGE_TAG"
            printf 'COMPOSE_PROJECT_NAME=%s\n' 'umamoe-resources-beta'
            printf 'CONTAINER_NAME=%s\n' 'umamoe-resources-beta'
            printf 'DATA_VOLUME_NAME=%s\n' 'umamoe-resources-beta-data'
            printf 'HOST_PORT=%s\n' "${BETA_HOST_PORT}"
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'MASTER_REFRESH_INTERVAL_SECONDS=%s\n' "${MASTER_REFRESH_INTERVAL_SECONDS:-300}"
            printf 'CLOUDFLARE_ZONE_ID=%s\n' "$CLOUDFLARE_ZONE_ID"
            printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CLOUDFLARE_API_TOKEN"
            printf 'PUBLIC_BASE_URL=%s\n' "$PUBLIC_BASE_URL"
            printf 'RUST_LOG=%s\n' "${RUST_LOG:-umamoe_resources=info,info}"
          } | ssh -o LogLevel=ERROR -p "$remote_port" "$DEPLOY_USER@$DEPLOY_HOST" "umask 077 && cat > '${BETA_REMOTE_APP_DIR}/env'"

      - name: Deploy remote container
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          ARCHIVE_NAME: ${{ needs.build.outputs.archive_name }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          remote_port="${DEPLOY_PORT:-22}"
          remote_archive="${REMOTE_IMAGE_DIR}/${ARCHIVE_NAME}"
          ssh -o LogLevel=ERROR -p "$remote_port" "$DEPLOY_USER@$DEPLOY_HOST" "set -euo pipefail; gzip -dc '${remote_archive}' | docker load >/dev/null; rm -f '${remote_archive}'; docker image inspect '${IMAGE_TAG}' >/dev/null; cd '${BETA_REMOTE_APP_DIR}'; docker compose --env-file env up -d --remove-orphans; docker image prune -f --filter 'until=168h' >/dev/null 2>&1 || true"

  deploy_production:
    if: github.event_name != 'pull_request'
    needs:
      - build
      - deploy_beta
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: umamoe-resources-image
          path: ${{ runner.temp }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Mask deployment metadata
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for value in "$DEPLOY_HOST"; do
            if [[ -n "$value" ]]; then
              echo "::add-mask::$value"
            fi
          done
          while IFS= read -r known_host_line; do
            if [[ -n "$known_host_line" ]]; then
              echo "::add-mask::$known_host_line"
            fi
          done <<< "$DEPLOY_KNOWN_HOSTS"

      - name: Start SSH agent
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add - <<< "$DEPLOY_SSH_KEY" >/dev/null 2>&1

      - name: Configure known hosts
        shell: bash
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment files
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          ARCHIVE_NAME: ${{ needs.build.outputs.archive_name }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MASTER_REFRESH_INTERVAL_SECONDS: ${{ secrets.MASTER_REFRESH_INTERVAL_SECONDS }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          RUST_LOG: ${{ secrets.RUST_LOG }}
        run: |
          set -euo pipefail
          remote_port="${DEPLOY_PORT:-22}"
          remote_archive="${REMOTE_IMAGE_DIR}/${ARCHIVE_NAME}"
          ssh -o LogLevel=ERROR -p "$remote_port" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '${PROD_REMOTE_APP_DIR}' '${REMOTE_IMAGE_DIR}' && chmod 700 '${PROD_REMOTE_APP_DIR}'"
          rsync -az -e "ssh -o LogLevel=ERROR -p $remote_port" deploy/docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:${PROD_REMOTE_APP_DIR}/docker-compose.yml"
          rsync -az -e "ssh -o LogLevel=ERROR -p $remote_port" "${{ runner.temp }}/${ARCHIVE_NAME}" "$DEPLOY_USER@$DEPLOY_HOST:${remote_archive}"
          {
            printf 'IMAGE=%s\n' "$IMAGE_TAG"
            printf 'COMPOSE_PROJECT_NAME=%s\n' 'umamoe-resources'
            printf 'CONTAINER_NAME=%s\n' 'umamoe-resources'
            printf 'DATA_VOLUME_NAME=%s\n' 'umamoe-resources-data'
            printf 'HOST_PORT=%s\n' "${PROD_HOST_PORT}"
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'MASTER_REFRESH_INTERVAL_SECONDS=%s\n' "${MASTER_REFRESH_INTERVAL_SECONDS:-300}"
            printf 'CLOUDFLARE_ZONE_ID=%s\n' "$CLOUDFLARE_ZONE_ID"
            printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CLOUDFLARE_API_TOKEN"
            printf 'PUBLIC_BASE_URL=%s\n' "$PUBLIC_BASE_URL"
            printf 'RUST_LOG=%s\n' "${RUST_LOG:-umamoe_resources=info,info}"
          } | ssh -o LogLevel=ERROR -p "$remote_port" "$DEPLOY_USER@$DEPLOY_HOST" "umask 077 && cat > '${PROD_REMOTE_APP_DIR}/env'"

      - name: Deploy remote container
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          ARCHIVE_NAME: ${{ needs.build.outputs.archive_name }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          remote_port="${DEPLOY_PORT:-22}"
          remote_archive="${REMOTE_IMAGE_DIR}/${ARCHIVE_NAME}"
          ssh -o LogLevel=ERROR -p "$remote_port" "$DEPLOY_USER@$DEPLOY_HOST" "set -euo pipefail; gzip -dc '${remote_archive}' | docker load >/dev/null; rm -f '${remote_archive}'; docker image inspect '${IMAGE_TAG}' >/dev/null; cd '${PROD_REMOTE_APP_DIR}'; docker compose --env-file env up -d --remove-orphans; docker image prune -f --filter 'until=168h' >/dev/null 2>&1 || true"
